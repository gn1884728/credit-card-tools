<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>信用卡切換速查 | 瘋哥的3c盒子</title>
    
    <!-- SEO 與社群分享標籤 -->
    <meta name="description" content="結帳總是忘記切換信用卡方案？瘋哥自製「信用卡權益決策神器」，免下載 App，一秒查詢最新通路回饋與最優推薦卡別。">
    <meta property="og:title" content="信用卡切換速查 | 瘋哥專屬工具">
    <meta property="og:description" content="結帳前一秒查完！精準切換方案，告訴你刷哪張卡最賺。">
    <meta property="og:image" content="https://card.fongarea.com/icon.png.png">
    <meta property="og:type" content="website">

    <!-- 📱 安卓 / iOS PWA 身分證與桌面圖示 -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png.png">
    <link rel="icon" type="image/png" href="icon.png.png">

    <!-- 🎨 樣式與圖示庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: env(safe-area-inset-bottom); }
        /* 隱藏捲動條但保留水平捲動功能，提升質感 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex justify-center items-start pt-10 px-4">
    
    <div class="w-full max-w-md bg-white p-6 rounded-[24px] shadow-lg border-t-4 border-blue-600 mb-8 relative overflow-hidden">
        
        <h2 class="text-xl font-bold mb-5 text-center text-black">
            <i class="fas fa-credit-card text-blue-600 mr-2"></i>信用卡切換速查
        </h2>

        <!-- 🌍 多國切換列 (炫技區塊) -->
        <div class="mb-5">
            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide" id="countrySelector">
                <button onclick="setCountry('TW', this)" class="country-btn flex-shrink-0 bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition-all transform scale-105">🇹🇼 台灣</button>
                <button onclick="setCountry('JP', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇯🇵 日本</button>
                <button onclick="setCountry('KR', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇰🇷 韓國</button>
                <button onclick="setCountry('TH', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇹🇭 泰國</button>
            </div>
        </div>

        <!-- 🗂️ 我的信用卡車庫 -->
        <div class="mb-5 p-4 bg-gray-50 rounded-xl border border-gray-100">
            <label class="block text-gray-700 text-sm font-bold mb-3">請勾選您持有的信用卡：</label>
            <div class="grid grid-cols-2 gap-3 text-sm text-gray-600" id="cardCheckboxes">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" value="CUBE卡" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="font-bold">國泰 CUBE 卡</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" value="台新Richart" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="font-bold">台新 Richart 體系</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" value="玉山Unicard" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="font-bold">玉山 Unicard</span>
                </label>
            </div>
        </div>

        <!-- 🔍 搜尋店名 -->
        <div class="mb-5 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400"></i>
            </div>
            <input type="text" id="storeSearch" oninput="searchStore()" placeholder="輸入店名速查 (例如：麥當勞、星巴克)..." class="w-full pl-9 pr-4 py-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 font-bold shadow-sm transition-colors">
        </div>
        
        <!-- 搜尋結果顯示區 (預設隱藏) -->
        <div id="storeResult" class="p-4 bg-blue-50 rounded-xl mb-5 text-sm font-bold text-blue-800 hidden border border-blue-100"></div>
        
        <!-- 💰 消費金額與回饋率 -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-500 text-xs mb-2 font-bold">消費金額</label>
                <input type="number" id="consumeAmt" placeholder="輸入金額" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 font-bold shadow-sm" oninput="calcPoints()">
            </div>
            <div>
                <label class="block text-gray-500 text-xs mb-2 font-bold">最優回饋率 (%)</label>
                <!-- 改為 text 型態以支援顯示 "3 + 2" -->
                <input type="text" id="consumeRate" placeholder="例如: 3" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 font-bold shadow-sm" oninput="calcPoints()">
            </div>
        </div>
        
        <!-- 🌟 試算結果 -->
        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-rose-50 rounded-xl mb-6 border border-rose-100 tracking-wide flex flex-col justify-center items-center min-h-[80px]">
            預估回饋：0
        </div>

        <!-- 🚀 查無特店回報區塊 -->
        <div class="border-t border-gray-100 pt-5 mt-2">
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                    <h4 class="text-sm font-bold text-blue-800 mb-1">查無特店？歡迎回報 🚀</h4>
                    <p class="text-xs text-gray-500 font-bold">提供截圖，擴大資料庫</p>
                </div>
                <a href="https://forms.gle/xLTZqzGPGXib2zYj6" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow transition-colors whitespace-nowrap">
                    提供截圖
                </a>
            </div>
        </div>

        <!-- 反向連結 -->
        <div class="text-center mt-6">
            <a href="https://fongarea.com" target="_blank" class="text-xs text-gray-400 hover:text-blue-500 font-bold transition-colors">
                &copy; 2026 瘋哥的3c盒子
            </a>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 多卡決策邏輯 JS -->
    <!-- ======================================================= -->
    <script>
        let customCubeData = [];
        window.currentBestMatch = null;
        let currentCountry = 'TW'; // 預設國家
        
        // 讀取多卡資料庫
        fetch('cube_config.json')
            .then(response => response.json())
            .then(data => {
                for (const cardName in data) {
                    for (const planName in data[cardName]) {
                        data[cardName][planName].forEach(store => {
                            customCubeData.push({
                                card: cardName,
                                name: store.name,
                                plan: planName,
                                rate: store.rate
                            });
                        });
                    }
                }
            })
            .catch(error => console.error('無法載入資料庫:', error));

        // 國家切換與動態 Placeholder 炫技邏輯
        const countryPlaceholders = {
            'TW': '輸入店名速查 (例如：麥當勞、星巴克)...',
            'JP': '輸入店名速查 (例如：唐吉訶德、BicCamera)...',
            'KR': '輸入店名速查 (例如：樂天超市、Olive Young)...',
            'TH': '輸入店名速查 (例如：Big C、Let\'s Relax)...'
        };

        function setCountry(code, btn) {
            currentCountry = code;
            
            // 重置所有按鈕樣式
            document.querySelectorAll('.country-btn').forEach(b => {
                b.className = 'country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all';
            });
            // 亮起當前點擊的按鈕並放大
            btn.className = 'country-btn flex-shrink-0 bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition-all transform scale-105';
            
            // 動態變更搜尋框 Placeholder
            const searchInput = document.getElementById('storeSearch');
            searchInput.placeholder = countryPlaceholders[code];
            
            // 清空當前搜尋結果並重新觸發搜尋 (為未來資料庫分離做準備)
            searchInput.value = '';
            searchStore();
        }

        // 【智慧封頂規則庫】
        function getPromoRule(name) {
            if (!name) return null;
            if (name.includes('麥當勞APP點餐')) {
                return { base: 0.03, bonus: 0.075, capAmt: 1066, desc: "最高刷 $1,066 拿滿 7.5% 額外加碼 (至10/31)" };
            }
            if (name.includes('星巴克儲值')) {
                return { base: 0.03, bonus: 0.02, capAmt: 5000, desc: "最高刷 $5,000 拿滿 2% 額外加碼 (至9/30)" };
            }
            return null;
        }

        // 精準關鍵字比對
        function searchMatch(val, name) {
            const keywords = val.trim().toLowerCase().split(/\s+/);
            const target = name.toLowerCase();
            return keywords.every(kw => target.includes(kw));
        }

        function searchStore() {
            const val = document.getElementById('storeSearch').value.trim(); 
            const resDiv = document.getElementById('storeResult');
            const checkedCards = Array.from(document.querySelectorAll('#cardCheckboxes input:checked')).map(cb => cb.value);

            // 未來可在這裡加入過濾國家的邏輯 (例如 && item.country === currentCountry)
            // 目前先共用同一個資料庫展示
            
            if (!val || customCubeData.length === 0) { 
                resDiv.classList.add('hidden'); 
                window.currentBestMatch = null;
                return; 
            }

            // 過濾並排序
            let matchedList = customCubeData.filter(item => 
                searchMatch(val, item.name) && checkedCards.includes(item.card)
            );
            matchedList.sort((a, b) => b.rate - a.rate);

            if (matchedList.length > 0) {
                resDiv.classList.remove('hidden'); 
                window.currentBestMatch = matchedList[0];
                
                // 動態渲染結果列表 (套用封頂規則顯示)
                resDiv.innerHTML = `✅ 找到 ${matchedList.length} 個適用方案 (已為您排序)：<br><br>` + 
                                   matchedList.map(m => {
                                       let rule = getPromoRule(m.name);
                                       let rateDisplay = rule ? `(${rule.base * 100}% + ${rule.bonus * 100}%)` : `(${Number((m.rate * 100).toFixed(1))}%)`;
                                       let extraNote = rule ? ` ➔ ⚠️ 封頂提醒：${rule.desc}` : '';
                                       
                                       return `
                                       <div class="mb-3">
                                           &bull; <b>[${m.card}]</b> ➔ 建議切換 <b>【${m.plan}】</b> ${rateDisplay}<br>
                                           <span class="ml-4 mt-1 inline-block text-xs text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">📌 適用：${m.name}${extraNote}</span>
                                       </div>
                                       `;
                                   }).join('');
                
                // 設定回饋率輸入框
                let topRule = getPromoRule(window.currentBestMatch.name);
                if (topRule) {
                    document.getElementById('consumeRate').value = `${topRule.base * 100} + ${topRule.bonus * 100}`;
                } else {
                    document.getElementById('consumeRate').value = Number((window.currentBestMatch.rate * 100).toFixed(1)); 
                }
                
                calcPoints();
            } else { 
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `⚠️ 在您勾選的卡片中，未找到符合通路。`; 
                document.getElementById('consumeRate').value = '';
                window.currentBestMatch = null;
                calcPoints();
            }
        }

        // 智慧結算系統 (含超額判定)
        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
            const rateInput = document.getElementById('consumeRate').value.toString().trim();
            
            let totalReward = 0;
            let isPromoCalc = false;
            let rule = window.currentBestMatch ? getPromoRule(window.currentBestMatch.name) : null;

            if (rule && rateInput === `${rule.base * 100} + ${rule.bonus * 100}`) {
                let baseReward = amt * rule.base;
                let bonusReward = Math.min(amt, rule.capAmt) * rule.bonus;
                totalReward = baseReward + bonusReward;
                isPromoCalc = true;
            } else {
                let parsedRate = 0;
                if (rateInput.includes('+')) {
                    let parts = rateInput.split('+');
                    parsedRate = (parseFloat(parts[0]) || 0) + (parseFloat(parts[1]) || 0);
                } else {
                    parsedRate = parseFloat(rateInput) || 0;
                }
                totalReward = amt * (parsedRate / 100);
            }

            let resultHtml = `預估回饋：${Math.round(totalReward)}`;
            if (isPromoCalc && amt > rule.capAmt) {
                resultHtml += `<div class="text-xs text-rose-500 mt-2 font-bold tracking-wide">⚠️ 已超過加碼上限，超出部分僅以 ${rule.base * 100}% 計算</div>`;
            }
            
            document.getElementById('pointResult').innerHTML = resultHtml;
        }
    </script>
</body>
</html>
