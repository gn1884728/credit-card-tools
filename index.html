<!-- ======================================================= -->
<!-- 信用卡決策精算引擎 (請整包替換您的白色卡片區塊) -->
<!-- ======================================================= -->
<div class="bg-white p-6 rounded-[24px] shadow-sm mb-6 relative">
    
    <h2 class="text-xl font-bold mb-6 text-center text-black">信用卡決策精算</h2>

    <!-- 🗂️ 我的信用卡車庫 (多卡勾選區) -->
    <div class="mb-5 p-4 bg-gray-50 rounded-xl border border-gray-100">
        <label class="block text-gray-700 text-sm font-bold mb-3">請勾選您持有的信用卡：</label>
        <div class="grid grid-cols-2 gap-3 text-sm text-gray-600" id="cardCheckboxes">
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="CUBE卡" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>國泰 CUBE 卡</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="台新Richart" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>台新 Richart 卡</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="台灣大白" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>台灣大白 (簽帳白金)</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="中信華航" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>中信華航璀璨無限卡</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="玉山星宇" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>玉山星宇世界卡</span>
            </label>
            <label class="flex items-center space-x-2">
                <input type="checkbox" value="匯豐旅人" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                <span>匯豐旅人無限卡</span>
            </label>
        </div>
    </div>

    <!-- 🔍 搜尋店名 -->
    <div class="mb-5 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
        </div>
        <input type="text" id="storeSearch" oninput="searchStore()" placeholder="輸入店名速查 (例如：全家、老井)..." class="w-full pl-9 pr-4 py-3 border border-gray-100 rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-600 transition-colors">
    </div>
    
    <!-- 搜尋結果顯示區 (預設隱藏) -->
    <div id="storeResult" class="p-4 bg-blue-50 rounded-xl mb-5 text-sm font-bold text-blue-800 hidden border border-blue-100"></div>
    
    <!-- 💰 消費金額與回饋率 -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
            <label class="block text-gray-500 text-xs mb-2 font-bold">消費金額</label>
            <input type="number" id="consumeAmt" placeholder="金額" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-700 shadow-sm" oninput="calcPoints()">
        </div>
        <div>
            <label class="block text-gray-500 text-xs mb-2 font-bold">最優回饋率 (%)</label>
            <input type="number" id="consumeRate" placeholder="回饋率" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 text-gray-700 shadow-sm" oninput="calcPoints()">
        </div>
    </div>
    
    <!-- 🌟 試算結果 -->
    <div id="pointResult" class="text-center text-xl font-bold text-[#e11d48] py-4 bg-gray-50 rounded-xl mb-6 tracking-wide">
        預估回饋：0
    </div>
</div>

<!-- ======================================================= -->
<!-- 多卡決策邏輯 JS -->
<!-- ======================================================= -->
<script>
    if (typeof customCubeData === 'undefined') {
        var customCubeData = [];
        
        // 目前先讀取您的 CUBE 舊資料庫，並自動打上標籤
        fetch('cube_config.json')
            .then(response => response.json())
            .then(data => {
                for (const plan in data.plans) {
                    data.plans[plan].forEach(store => {
                        customCubeData.push({
                            card: "CUBE卡", // 暫時全部定義為 CUBE 卡
                            name: store.name,
                            plan: plan,
                            rate: store.rate
                        });
                    });
                }
            })
            .catch(error => console.error('無法載入資料庫:', error));
    }

    function fuzzyMatch(p, s) { 
        let pI = 0, sI = 0; 
        p = p.replace(/\s+/g, '').toLowerCase(); 
        s = s.replace(/\s+/g, '').toLowerCase(); 
        while (pI < p.length && sI < s.length) { 
            if (p[pI] === s[sI]) pI++; 
            sI++; 
        } 
        return pI === p.length; 
    }

    function searchStore() {
        const val = document.getElementById('storeSearch').value.trim(); 
        const resDiv = document.getElementById('storeResult');
        
        // 抓取畫面上「有被打勾」的信用卡
        const checkedCards = Array.from(document.querySelectorAll('#cardCheckboxes input:checked')).map(cb => cb.value);

        if (!val || customCubeData.length === 0) { 
            resDiv.classList.add('hidden'); 
            return; 
        }

        // 過濾條件：1. 符合店名 2. 必須是打勾的卡片
        let matchedList = customCubeData.filter(item => 
            fuzzyMatch(val, item.name) && checkedCards.includes(item.card)
        );

        // 自動決策：將回饋率從高排到低
        matchedList.sort((a, b) => b.rate - a.rate);

        if (matchedList.length > 0) {
            resDiv.classList.remove('hidden'); 
            resDiv.innerHTML = `✅ 找到 ${matchedList.length} 個適用方案 (已為您排序)：<br><br>` + 
                               matchedList.map(m => `&bull; <b>[${m.card}]</b> ➔ 建議切換 <b>【${m.plan}】</b> (${Math.round(m.rate*100)}%)<br>`).join('');
            
            // 自動帶入「最高」的那張卡的回饋率
            document.getElementById('consumeRate').value = Math.round(matchedList[0].rate * 100); 
            calcPoints();
        } else { 
            resDiv.classList.remove('hidden'); 
            resDiv.innerHTML = `⚠️ 在您勾選的卡片中，未找到符合通路。`; 
            document.getElementById('consumeRate').value = '';
            calcPoints();
        }
    }

    function calcPoints() {
        const amt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
        const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
        document.getElementById('pointResult').innerText = `預估回饋：${Math.round(amt * rate)}`;
    }
</script>
