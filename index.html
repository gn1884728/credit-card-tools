<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>信用卡切換速查 | 瘋哥的3c盒子</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png.png">
    <link rel="icon" type="image/png" href="icon.png.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: env(safe-area-inset-bottom); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        img.fallback-icon { display: none; }
        img.loaded { display: block; width: 36px; height: 24px; object-fit: cover; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-right: 8px; margin-top: 2px; flex-shrink: 0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex justify-center items-start pt-10 px-4">
    
    <div class="w-full max-w-md bg-white p-6 rounded-[24px] shadow-lg border-t-4 border-blue-600 mb-8 relative overflow-hidden">
        
        <h2 class="text-xl font-bold mb-5 text-center text-black">
            <i class="fas fa-credit-card text-blue-600 mr-2"></i>信用卡切換速查
        </h2>

        <div class="mb-5">
            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide" id="countrySelector">
                <button onclick="setCountry('TW', this)" class="country-btn flex-shrink-0 bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition-all transform scale-105">🇹🇼 台灣</button>
                <button onclick="setCountry('JP', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇯🇵 日本</button>
                <button onclick="setCountry('KR', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇰🇷 韓國</button>
                <button onclick="setCountry('TH', this)" class="country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all">🇹🇭 泰國</button>
            </div>
        </div>

        <div class="mb-6" id="garageContainer">
            <div class="text-center text-xs text-gray-400 py-4">載入支付車庫中...</div>
        </div>

        <div class="mb-5 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fas fa-search text-gray-400"></i>
            </div>
            <input type="text" id="storeSearch" oninput="searchStore()" placeholder="輸入店名速查..." class="w-full pl-9 pr-4 py-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 font-bold shadow-sm transition-colors">
        </div>
        
        <div id="storeResult" class="p-4 bg-blue-50 rounded-xl mb-5 text-sm font-bold text-blue-800 hidden border border-blue-100"></div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-blue-800 text-xs mb-2 font-bold" id="amtLabel">消費金額 (台幣 TWD)</label>
                <input type="number" id="consumeAmt" placeholder="輸入當地金額" class="w-full p-3 border border-gray-100 rounded-xl bg-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 font-bold shadow-sm" oninput="calcPoints()">
                <div id="twdEstimate" class="mt-1.5 text-[10px] text-gray-500 font-bold hidden bg-blue-50 p-1.5 rounded-lg border border-blue-100 tracking-wide text-center"></div>
            </div>
            <div>
                <label class="block text-gray-500 text-xs mb-2 font-bold">最優回饋率 / 哩程比</label>
                <input type="text" id="consumeRate" readonly placeholder="例如: 3%" class="w-full p-3 border border-gray-100 rounded-xl bg-gray-50 text-sm focus:outline-none text-gray-700 font-bold shadow-sm">
            </div>
        </div>
        
        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-rose-50 rounded-xl mb-6 border border-rose-100 tracking-wide flex flex-col justify-center items-center min-h-[80px]">
            預估回饋：0
        </div>

        <div class="border-t border-gray-100 pt-5 mt-2">
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                    <h4 class="text-sm font-bold text-blue-800 mb-1">查無特店？歡迎回報 🚀</h4>
                    <p class="text-xs text-gray-500 font-bold">提供截圖，擴大資料庫</p>
                </div>
                <a href="https://forms.gle/xLTZqzGPGXib2zYj6" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow transition-colors whitespace-nowrap">
                    提供截圖
                </a>
            </div>
        </div>

        <div class="text-center mt-6">
            <a href="https://fongarea.com" target="_blank" class="text-xs text-gray-400 hover:text-blue-500 font-bold transition-colors">&copy; 2026 瘋哥的3c盒子</a>
        </div>
    </div>

    <script>
        let globalDatabase = {}; 
        let currentCountryData = []; 
        window.currentBestMatch = null;
        let currentCountry = 'TW'; 
        
        const MILEAGE_VALUATION = 0.5; 
        let fxRates = { TWD: 1, JPY: 4.5, KRW: 42.0, THB: 1.05 }; 
        const countryCurrencyMap = {
            'TW': { code: 'TWD', name: '台幣' },
            'JP': { code: 'JPY', name: '日圓' },
            'KR': { code: 'KRW', name: '韓元' },
            'TH': { code: 'THB', name: '泰銖' }
        };

        fetch('https://api.exchangerate-api.com/v4/latest/TWD')
            .then(response => response.json())
            .then(data => { if (data && data.rates) fxRates = data.rates; })
            .catch(error => console.error("匯率載入失敗", error));
        
        const unicardConfig = {
            'simple': { name: '簡單選', base: 0.01, bonus: 0.02, capAmt: 50000, desc: "最高刷5萬拿滿2%加碼" },
            'any': { name: '任意選', base: 0.01, bonus: 0.025, capAmt: 40000, desc: "最高刷4萬拿滿2.5%加碼" },
            'up': { name: 'UP選', base: 0.01, bonus: 0.035, capAmt: 142857, desc: "最高刷14.2萬拿滿3.5%加碼" }
        };

        // ✈️ 哩程卡動態設定表
        const hsbcConfig = {
            'infinite': { name: '旅人無限卡', tw: 18, overseas: 10 },
            'signature': { name: '旅人御璽卡', tw: 18, overseas: 15 },
            'light': { name: '旅人輕旅卡', tw: 20, overseas: 20 }
        };

        const starluxConfig = {
            'world': { name: '世界卡', tw: 20, overseas: 10, birthdayOverseas: 5 },
            'business': { name: '商務鈦金卡', tw: 25, overseas: 15, birthdayOverseas: 10 },
            'titanium': { name: '鈦金卡', tw: 28, overseas: 20, birthdayOverseas: null } // 鈦金無生日加碼
        };

        fetch('cube_config.json')
            .then(response => response.json())
            .then(data => { globalDatabase = data; renderDynamicUI('TW'); })
            .catch(error => console.error('無法載入資料庫:', error));

        const countryPlaceholders = {
            'TW': '輸入店名速查 (例如：麥當勞、星巴克)...',
            'JP': '輸入店名速查 (例如：松本清、唐吉訶德)...',
            'KR': '輸入店名速查 (例如：樂天免稅店)...',
            'TH': '輸入店名速查 (例如：泰國 7-11)...'
        };

        function setCountry(code, btn) {
            currentCountry = code;
            document.querySelectorAll('.country-btn').forEach(b => {
                b.className = 'country-btn flex-shrink-0 bg-white text-gray-500 border border-gray-200 px-5 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-gray-50 transition-all';
            });
            btn.className = 'country-btn flex-shrink-0 bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition-all transform scale-105';
            
            document.getElementById('storeSearch').placeholder = countryPlaceholders[code];
            document.getElementById('storeSearch').value = '';
            
            let curr = countryCurrencyMap[code];
            document.getElementById('amtLabel').innerText = `消費金額 (${curr.name} ${curr.code})`;
            document.getElementById('consumeAmt').value = '';
            document.getElementById('twdEstimate').classList.add('hidden');
            document.getElementById('pointResult').innerHTML = `預估回饋：0`;
            
            renderDynamicUI(code);
            searchStore();
        }

        function formatPaymentNameWithImage(method) {
            let imgFileName = null;
            let cssFallback = '<i class="fas fa-credit-card text-gray-400 text-sm mr-2 mt-0.5 flex-shrink-0" id="fallback-'+method+'"></i>';

            if (method.includes('玉山星宇')) imgFileName = 'starlux.png';
            else if (method.includes('星展飛行')) imgFileName = 'dbs.png';
            else if (method.includes('滙豐') || method.includes('旅人')) imgFileName = 'hsbc.png';
            else if (method.includes('CUBE')) imgFileName = 'cube.png';
            else if (method.includes('玉山Unicard')) imgFileName = 'unicard.png';
            else if (method.includes('PayPay')) imgFileName = 'paypay.png';
            
            if (method.includes('PayPay')) cssFallback = '<span class="bg-[#FF0032] text-white text-[14px] w-[24px] h-[24px] flex items-center justify-center rounded-[6px] font-black italic mr-2 shadow-sm flex-shrink-0">P</span>';
            else if (method.includes('全盈Pay')) cssFallback = '<span class="bg-[#00B1EB] text-white text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">全盈</span>';
            else if (method.includes('全支付')) cssFallback = '<span class="bg-[#FF6B00] text-white text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">全支付</span>';
            else if (method.includes('iPass Money')) cssFallback = '<span class="bg-[#008985] text-white text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">iPass</span>';
            else if (method.includes('街口支付')) cssFallback = '<span class="bg-[#E4002B] text-white text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">街口</span>';
            else if (method.includes('台新Pay+')) cssFallback = '<span class="bg-[#E60012] text-white text-[10px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">台新Pay+</span>';
            else if (method.includes('玉山星宇')) cssFallback = '<span class="bg-[#8E8B82] text-white border border-[#5A5853] text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0 flex items-center"><i class="fas fa-plane text-[8px] mr-1"></i>星宇</span>';
            else if (method.includes('星展飛行')) cssFallback = '<span class="bg-black text-white border border-gray-600 text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0 flex items-center"><span class="text-white mr-0.5 font-sans font-normal">X</span>星展</span>';
            else if (method.includes('滙豐') || method.includes('旅人')) cssFallback = '<span class="bg-gradient-to-r from-[#1E2B2A] to-[#3A4A49] text-white border border-[#859897] text-[9px] px-1.5 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0 flex items-center">HSBC 旅人</span>';
            else if (method.includes('玉山') || method.includes('Unicard')) cssFallback = '<span class="bg-[#009e86] text-white text-[9px] px-1.5 py-0.5 rounded-sm font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">玉山</span>';
            else if (method.includes('CUBE')) cssFallback = '<span class="bg-[#00a850] text-white text-[9px] px-1.5 py-0.5 rounded-sm font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">CUBE</span>';
            else if (method.includes('Richart')) cssFallback = '<span class="bg-[#ff0033] text-white text-[9px] px-1.5 py-0.5 rounded-sm font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">台新</span>';
            else if (method.includes('LINE Pay')) cssFallback = '<i class="fab fa-line text-[#06C755] text-lg mr-2 mt-0.5 flex-shrink-0"></i>';
            else if (method.includes('TrueMoney')) cssFallback = '<span class="bg-[#f26522] text-white text-[9px] px-1.5 py-0.5 rounded-sm font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">True</span>';

            let mainName = method, subName = '';
            if (method.includes('(') && method.includes(')')) {
                let parts = method.split('(');
                mainName = parts[0].trim();
                subName = '(' + parts[1];
            }

            let imgTag = imgFileName 
                ? `<img src="images/${imgFileName}" class="fallback-icon" onload="this.className='loaded'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                : '';

            return `
                <div class="flex items-start w-full">
                    ${imgTag}
                    <div style="${imgFileName ? 'display:none;' : 'display:flex;'}">${cssFallback}</div>
                    <div class="flex flex-col flex-1 overflow-hidden ml-1">
                        <span class="font-bold text-[13px] text-gray-800 truncate">${mainName}</span>
                        ${subName ? `<span class="text-[9px] text-gray-400 font-normal leading-tight text-truncate-2 mt-0.5">${subName}</span>` : ''}
                    </div>
                </div>
            `;
        }

        // 🌟 處理星宇卡生日選單的顯示與隱藏
        window.toggleStarluxBirthday = function() {
            const level = document.getElementById('starluxLevel').value;
            const bdayDiv = document.getElementById('starluxBirthdayDiv');
            const bdayCheck = document.getElementById('starluxBirthdayCheck');
            
            if (level === 'titanium') {
                bdayDiv.classList.add('hidden');
                bdayCheck.checked = false; // 鈦金卡強制作廢生日選項
            } else {
                bdayDiv.classList.remove('hidden');
            }
            searchStore();
        };

        function buildCheckboxBlock(method) {
            let extraDropdown = '';
            if (method.includes('玉山Unicard')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="unicardLevel" class="w-full text-[11px] border border-emerald-200 rounded-md p-1.5 bg-emerald-50 text-emerald-800 font-bold focus:outline-none" onchange="searchStore()">
                            <option value="up" selected>🏆 UP選 (最高4.5%)</option>
                            <option value="any">🎯 任意選 (最高3.5%)</option>
                            <option value="simple">🔰 簡單選 (最高3%)</option>
                        </select>
                    </div>`;
            } else if (method.includes('全盈Pay')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="pluspayLevel" class="w-full text-[11px] border border-blue-200 rounded-md p-1.5 bg-blue-50 text-blue-800 font-bold focus:outline-none" onchange="searchStore()">
                            <option value="old" selected>👤 舊戶 (最高18.5%)</option>
                            <option value="new">🌟 新戶 (最高28.5%)</option>
                        </select>
                    </div>`;
            } else if (method.includes('滙豐') || method.includes('旅人')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="hsbcLevel" class="w-full text-[11px] border border-gray-300 rounded-md p-1.5 bg-gray-50 text-gray-800 font-bold focus:outline-none" onchange="searchStore()">
                            <option value="infinite" selected>💳 旅人無限卡</option>
                            <option value="signature">💳 旅人御璽卡</option>
                            <option value="light">💳 旅人輕旅卡</option>
                        </select>
                    </div>`;
            } else if (method.includes('玉山星宇')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="starluxLevel" class="w-full text-[11px] border border-yellow-200 rounded-md p-1.5 bg-yellow-50 text-yellow-800 font-bold focus:outline-none mb-2" onchange="toggleStarluxBirthday()">
                            <option value="world" selected>✈️ 世界卡</option>
                            <option value="business">✈️ 商務鈦金卡</option>
                            <option value="titanium">✈️ 鈦金卡</option>
                        </select>
                        <div id="starluxBirthdayDiv" class="flex items-center mt-1 ml-1 ${currentCountry === 'TW' ? 'hidden' : ''}">
                            <input type="checkbox" id="starluxBirthdayCheck" class="w-3 h-3 text-yellow-600 rounded border-gray-300 focus:ring-yellow-500 mr-1.5" onchange="searchStore()">
                            <label for="starluxBirthdayCheck" class="text-[10px] text-gray-500 font-bold cursor-pointer">🎂 剛好是生日月</label>
                        </div>
                    </div>`;
            }
            return `
                <div class="flex flex-col bg-white p-2.5 border border-gray-200 rounded-xl shadow-sm hover:border-blue-400 transition-colors w-full">
                    <label class="flex items-center cursor-pointer w-full">
                        <input type="checkbox" value="${method}" checked class="w-4 h-4 text-blue-600 rounded mr-2 flex-shrink-0" onchange="searchStore()">
                        ${formatPaymentNameWithImage(method)}
                    </label>
                    ${extraDropdown}
                </div>`;
        }

        function renderDynamicUI(countryCode) {
            const countryObj = globalDatabase[countryCode] || {};
            const paymentMethods = Object.keys(countryObj);
            const container = document.getElementById('garageContainer');
            
            if (paymentMethods.length === 0) {
                container.innerHTML = `<div class="text-xs text-rose-500 p-3 bg-rose-50 rounded-xl border border-rose-100 text-center">目前該區尚無資料</div>`;
                return;
            }

            let categories = {
                mobile: { title: '📱 行動支付', items: [], color: 'bg-blue-50 border-blue-100 text-blue-800' },
                mileage: { title: '✈️ 航空哩程卡', items: [], color: 'bg-slate-100 border-slate-200 text-slate-800' },
                cashback: { title: '💰 點數 / 現金回饋', items: [], color: 'bg-emerald-50 border-emerald-100 text-emerald-800' }
            };

            paymentMethods.forEach(method => {
                let htmlBlock = buildCheckboxBlock(method);
                let isMileage = false;
                for (const plan in countryObj[method]) {
                    if (countryObj[method][plan].some(store => store.type === 'mileage')) {
                        isMileage = true;
                        break;
                    }
                }
                if (isMileage) categories.mileage.items.push(htmlBlock);
                else if (/Pay|支付|Wallet|iPass|街口|TrueMoney/i.test(method)) categories.mobile.items.push(htmlBlock);
                else categories.cashback.items.push(htmlBlock);
            });

            let finalHtml = '';
            for (let catKey in categories) {
                let cat = categories[catKey];
                if (cat.items.length > 0) {
                    finalHtml += `
                        <div class="mb-4">
                            <h3 class="text-xs font-bold px-3 py-1.5 rounded-t-lg border-b-0 border inline-block ${cat.color}">
                                ${cat.title}
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 p-3 rounded-b-lg rounded-tr-lg border ${cat.color.replace('text-', 'border-').split(' ')[1]} bg-white/50">
                                ${cat.items.join('')}
                            </div>
                        </div>
                    `;
                }
            }
            container.innerHTML = finalHtml;

            // 確保切換國家時星宇生日選項的顯示狀態正確 (僅限海外顯示)
            const bdayDiv = document.getElementById('starluxBirthdayDiv');
            if (bdayDiv) {
                const sLevel = document.getElementById('starluxLevel').value;
                if (countryCode === 'TW' || sLevel === 'titanium') bdayDiv.classList.add('hidden');
                else bdayDiv.classList.remove('hidden');
            }

            currentCountryData = [];
            for (const method in countryObj) {
                for (const plan in countryObj[method]) {
                    countryObj[method][plan].forEach(store => {
                        let baseItem = { card: method, name: store.name, plan: plan };
                        if (store.type === 'mileage') {
                            baseItem.type = 'mileage';
                            baseItem.ratio = store.ratio;
                            baseItem.unit = store.unit;
                            baseItem.rate = MILEAGE_VALUATION / store.ratio; 
                        } else {
                            baseItem.type = 'cashback';
                            baseItem.rate = store.rate;
                        }
                        currentCountryData.push(baseItem);
                    });
                }
            }
        }

        function getPromoRule(item) {
            if (!item) return null;
            if (item.name.includes('麥當勞APP點餐')) return { base: 0.03, bonus: 0.075, capAmt: 1066, desc: "最高刷 $1,066 拿滿 7.5% 額外加碼" };
            if (item.name.includes('星巴克儲值')) return { base: 0.03, bonus: 0.02, capAmt: 5000, desc: "最高刷 $5,000 拿滿 2% 額外加碼" };
            if (item.card === '玉山Unicard') {
                const uLevel = document.getElementById('unicardLevel') ? document.getElementById('unicardLevel').value : 'up';
                return unicardConfig[uLevel];
            }
            return null;
        }

        function searchMatch(val, name) {
            return val.trim().toLowerCase().split(/\s+/).every(kw => name.toLowerCase().includes(kw));
        }

        function searchStore() {
            const val = document.getElementById('storeSearch').value.trim(); 
            const resDiv = document.getElementById('storeResult');
            const checkedMethods = Array.from(document.querySelectorAll('#garageContainer input:checked')).map(cb => cb.value);

            if (!val) { 
                resDiv.classList.add('hidden'); 
                window.currentBestMatch = null;
                return; 
            }

            let matchedList = currentCountryData.filter(item => 
                searchMatch(val, item.name) && checkedMethods.includes(item.card)
            );

            // 🛡️ 國內外全通路自動打底神盾
            const hasRichart = checkedMethods.some(m => m.includes('Richart') && !m.includes('台新Pay+'));
            const hasCube = checkedMethods.some(m => m.includes('CUBE'));
            const hasUnicard = checkedMethods.some(m => m.includes('玉山Unicard'));
            const hasHsbc = checkedMethods.some(m => m.includes('滙豐'));
            const hasStarlux = checkedMethods.some(m => m.includes('星宇'));
            const hasDbs = checkedMethods.some(m => m.includes('星展'));

            if (currentCountry !== 'TW') {
                if (hasRichart && !matchedList.some(m => m.card.includes('Richart') && m.plan === '玩旅刷')) {
                    matchedList.push({ card: "台新Richart", name: `${val} (實體/線上通用)`, plan: "玩旅刷", type: 'cashback', rate: 0.033, isBaseline: true });
                }
                if (hasCube && !matchedList.some(m => m.card.includes('CUBE') && m.plan === '趣旅行')) {
                    matchedList.push({ card: "CUBE卡", name: `${val} (海外實體通用)`, plan: "趣旅行", type: 'cashback', rate: 0.03, isBaseline: true });
                }
                if (hasUnicard) {
                    matchedList = matchedList.filter(m => m.card !== '玉山Unicard');
                    const uConf = unicardConfig[document.getElementById('unicardLevel') ? document.getElementById('unicardLevel').value : 'up'];
                    matchedList.push({ card: "玉山Unicard", name: `${val} (海外實體通用)`, plan: uConf.name, type: 'cashback', rate: uConf.base + uConf.bonus, isBaseline: true });
                }
                if (hasHsbc && !matchedList.some(m => m.card.includes('滙豐') && m.isBaseline)) {
                    matchedList.push({ card: "滙豐旅人無限卡", name: `${val} (海外實體通用)`, plan: "海外消費", type: 'mileage', ratio: 10, unit: '哩', rate: MILEAGE_VALUATION/10, isBaseline: true });
                    matchedList.push({ card: "滙豐旅人無限卡", name: `${val} (海外線上通用)`, plan: "海外消費", type: 'mileage', ratio: 10, unit: '哩', rate: MILEAGE_VALUATION/10, isBaseline: true });
                }
                if (hasStarlux && !matchedList.some(m => m.card.includes('星宇') && m.isBaseline)) {
                    matchedList.push({ card: "玉山星宇世界卡", name: `${val} (海外實體通用)`, plan: "海外消費", type: 'mileage', ratio: 10, unit: '哩', rate: MILEAGE_VALUATION/10, isBaseline: true });
                }
                if (hasDbs && !matchedList.some(m => m.card.includes('星展') && m.isBaseline)) {
                    matchedList.push({ card: "星展飛行世界之極卡", name: `${val} (海外實體通用)`, plan: "海外消費", type: 'mileage', ratio: 15, unit: '飛行基金', rate: MILEAGE_VALUATION/15, isBaseline: true });
                }
            } else {
                if (hasHsbc && !matchedList.some(m => m.card.includes('滙豐') && m.isBaseline)) {
                    matchedList.push({ card: "滙豐旅人無限卡", name: `${val} (國內實體通用)`, plan: "國內消費", type: 'mileage', ratio: 18, unit: '哩', rate: MILEAGE_VALUATION/18, isBaseline: true });
                }
                if (hasStarlux && !matchedList.some(m => m.card.includes('星宇') && m.isBaseline)) {
                    matchedList.push({ card: "玉山星宇世界卡", name: `${val} (國內實體通用)`, plan: "國內消費", type: 'mileage', ratio: 20, unit: '哩', rate: MILEAGE_VALUATION/20, isBaseline: true });
                }
                if (hasDbs && !matchedList.some(m => m.card.includes('星展') && m.isBaseline)) {
                    matchedList.push({ card: "星展飛行世界之極卡", name: `${val} (國內實體通用)`, plan: "國內消費", type: 'mileage', ratio: 18, unit: '飛行基金', rate: MILEAGE_VALUATION/18, isBaseline: true });
                }
            }

            // 🎯 動態覆蓋引擎：處理等級與生日月變更
            matchedList = matchedList.filter(m => {
                if (m.card === '玉山Unicard') {
                    const uConf = unicardConfig[document.getElementById('unicardLevel').value];
                    m.rate = uConf.base + uConf.bonus; 
                    m.plan = uConf.name; 
                } 
                else if (m.card.includes('全盈Pay')) {
                    const pLevel = document.getElementById('pluspayLevel').value;
                    m.rate = pLevel === 'old' ? 0.185 : 0.285;
                    m.plan = pLevel === 'old' ? "綁玉山數位/郵局 (舊戶)" : "綁玉山數位/郵局 (限新戶)";
                }
                else if (m.card.includes('滙豐')) {
                    const hLevel = document.getElementById('hsbcLevel').value;
                    const hConf = hsbcConfig[hLevel];
                    m.card = hConf.name;
                    m.ratio = currentCountry === 'TW' ? hConf.tw : hConf.overseas;
                    m.rate = MILEAGE_VALUATION / m.ratio;
                }
                else if (m.card.includes('星宇')) {
                    const sLevel = document.getElementById('starluxLevel').value;
                    const sConf = starluxConfig[sLevel];
                    const isBday = document.getElementById('starluxBirthdayCheck') ? document.getElementById('starluxBirthdayCheck').checked : false;
                    
                    m.card = "玉山星宇" + sConf.name;
                    
                    if (currentCountry === 'TW') {
                        // 國內不套用生日加碼
                        if (m.name.includes('生日月')) return false; 
                        m.ratio = sConf.tw;
                        m.plan = "國內消費";
                    } else {
                        // 海外邏輯
                        if (isBday && sConf.birthdayOverseas !== null) {
                            // 若勾選生日，且該卡別有生日優惠 (排除鈦金)
                            m.ratio = sConf.birthdayOverseas;
                            m.plan = "🎂 生日月專屬加碼";
                            m.name = m.name.replace('(海外實體通用)', '(海外實體生日)');
                        } else {
                            // 未勾選生日，或鈦金卡
                            if (m.name.includes('生日月')) return false; // 隱藏原本 JSON 裡的生日選項，避免重複
                            m.ratio = sConf.overseas;
                            m.plan = "海外消費";
                        }
                    }
                    m.rate = MILEAGE_VALUATION / m.ratio;
                }
                return true;
            });

            matchedList.sort((a, b) => b.rate - a.rate);

            if (matchedList.length > 0) {
                resDiv.classList.remove('hidden'); 
                window.currentBestMatch = matchedList[0];
                
                resDiv.innerHTML = `✅ 找到 ${matchedList.length} 個適用方案 (已為您排序)：<br><br>` + 
                                   matchedList.map(m => {
                                       let rule = getPromoRule(m); 
                                       
                                       let rateDisplay = '';
                                       if (m.type === 'mileage') {
                                           rateDisplay = `(${m.ratio}元/${m.unit})`;
                                       } else {
                                           rateDisplay = rule ? `(${Number((rule.base * 100).toFixed(2))}% + ${Number((rule.bonus * 100).toFixed(2))}%)` : `(${Number((m.rate * 100).toFixed(2))}%)`;
                                       }

                                       let extraNote = rule ? ` ➔ ⚠️ 封頂提醒：${rule.desc}` : '';
                                       let badgeStyle = m.isBaseline ? 'text-indigo-600 bg-indigo-50 border-indigo-100' : 'text-rose-600 bg-rose-50 border-rose-100';
                                       let badgeText = m.isBaseline ? `🛡️ 智能打底：${m.name}` : `📌 適用：${m.name}`;

                                       return `
                                       <div class="mb-3">
                                           &bull; <b>[${m.card.replace(/ \(.+\)/, '')}]</b> ➔ 建議切換 <b>【${m.plan}】</b> <span class="font-bold text-rose-600">${rateDisplay}</span><br>
                                           <span class="ml-4 mt-1 inline-block text-[11px] font-bold ${badgeStyle} px-2 py-0.5 rounded border">${badgeText}${extraNote}</span>
                                       </div>
                                       `;
                                   }).join('');
                
                let topM = window.currentBestMatch;
                if (topM.type === 'mileage') {
                    document.getElementById('consumeRate').value = `${topM.ratio} 元/${topM.unit}`;
                } else {
                    let topRule = getPromoRule(topM);
                    document.getElementById('consumeRate').value = topRule ? `${topRule.base * 100} + ${topRule.bonus * 100}%` : `${Number((topM.rate * 100).toFixed(2))}%`; 
                }
                
                calcPoints();
            } else { 
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `⚠️ 未找到符合通路。`; 
                document.getElementById('consumeRate').value = '';
                window.currentBestMatch = null;
                calcPoints();
            }
        }

        function calcPoints() {
            const rawInputAmt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
            const estDiv = document.getElementById('twdEstimate');
            const match = window.currentBestMatch;
            
            if (!match) return;

            let twdAmt = rawInputAmt;
            const currCode = countryCurrencyMap[currentCountry].code;
            
            if (currentCountry !== 'TW' && fxRates[currCode]) {
                twdAmt = rawInputAmt / fxRates[currCode];
                if (rawInputAmt > 0) {
                    let displayRate = (1 / fxRates[currCode]).toFixed(4); 
                    estDiv.innerHTML = `即時換算：約 <span class="text-blue-700">NT$ ${Math.round(twdAmt).toLocaleString()}</span> <span class="text-[9px] text-gray-400">(匯率 ${displayRate})</span>`;
                    estDiv.classList.remove('hidden');
                } else {
                    estDiv.classList.add('hidden');
                }
            } else {
                estDiv.classList.add('hidden');
            }
            
            let resultHtml = '';

            if (match.type === 'mileage') {
                let miles = Math.floor(twdAmt / match.ratio); 
                resultHtml = `預估回饋：${miles.toLocaleString()} ${match.unit}`;
                if (currentCountry !== 'TW' && !match.card.includes('玉山Wallet')) {
                    resultHtml += `<div class="text-[11px] text-gray-400 mt-2 font-normal">💡 海外實體交易可能產生 1.5% 手續費</div>`;
                }
            } 
            else {
                let totalReward = 0;
                let isPromoCalc = false;
                let rule = getPromoRule(match);

                if (rule) {
                    let baseReward = twdAmt * rule.base;
                    let bonusReward = Math.min(twdAmt, rule.capAmt) * rule.bonus; 
                    totalReward = baseReward + bonusReward;
                    isPromoCalc = true;
                } else {
                    totalReward = twdAmt * match.rate;
                }

                resultHtml = `預估回饋：${Math.round(totalReward).toLocaleString()}`;
                if (isPromoCalc && twdAmt > rule.capAmt) {
                    resultHtml += `<div class="text-xs text-rose-500 mt-2 font-bold tracking-wide">⚠️ 已超過加碼上限，超出部分僅以基本 ${rule.base * 100}% 計算</div>`;
                }
            }
            
            document.getElementById('pointResult').innerHTML = resultHtml;
        }
    </script>
</body>
