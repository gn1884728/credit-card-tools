<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>信用卡切換速查 | 瘋哥的3c盒子</title>
    <meta name="description" content="結帳前 3 秒必看！輸入金額與店名，立即精算最佳信用卡組合與切換方案。">
    <meta property="og:title" content="信用卡切換速查 | 瘋哥的3c盒子">
    <meta property="og:description" content="自動精算 CUBE、玉山 Unicard、台新 Richart、星宇航空等神卡最佳刷卡方案。">
    <meta property="og:type" content="website">
    
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png.png">
    <link rel="icon" type="image/png" href="icon.png.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .text-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        img.fallback-icon { display: none; }
        img.loaded { display: block; width: 32px; height: 20px; object-fit: cover; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); margin-right: 8px; flex-shrink: 0; }
        
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.show { transform: translateY(0); }
        .backdrop { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .backdrop.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start text-gray-800 pb-[env(safe-area-inset-bottom)]">
    
    <div class="w-full max-w-md bg-white min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 pt-[calc(env(safe-area-inset-top)+2.5rem)] pb-6 px-6 shadow-md z-10 relative">
            <h2 class="text-2xl font-black text-center text-white tracking-wide flex justify-center items-center">
                <i class="fas fa-bolt text-yellow-300 mr-2"></i>刷卡速查
            </h2>
        </div>

        <div class="flex-1 overflow-y-auto px-5 py-6 pb-24 scrollbar-hide">
            
            <!-- 國家切換 -->
            <div class="mb-6 flex space-x-2 overflow-x-auto pb-1 scrollbar-hide" id="countrySelector">
                <button onclick="setCountry('TW', this)" class="country-btn flex-1 bg-blue-600 text-white px-4 py-2.5 rounded-full text-sm font-bold shadow-md transition-all">🇹🇼 台灣</button>
                <button onclick="setCountry('JP', this)" class="country-btn flex-1 bg-gray-100 text-gray-500 px-4 py-2.5 rounded-full text-sm font-bold transition-all hover:bg-gray-200">🇯🇵 日本</button>
                <button onclick="setCountry('KR', this)" class="country-btn flex-1 bg-gray-100 text-gray-500 px-4 py-2.5 rounded-full text-sm font-bold transition-all hover:bg-gray-200">🇰🇷 韓國</button>
                <button onclick="setCountry('TH', this)" class="country-btn flex-1 bg-gray-100 text-gray-500 px-4 py-2.5 rounded-full text-sm font-bold transition-all hover:bg-gray-200">🇹🇭 泰國</button>
            </div>

            <!-- 輸入區塊 -->
            <div class="bg-gray-50 p-4 rounded-[20px] mb-6 border border-gray-100 shadow-sm">
                <div class="mb-4">
                    <div class="flex justify-between items-end mb-2">
                        <label for="consumeAmt" class="text-sm font-black text-gray-800 tracking-wide" id="amtLabel">消費金額 (TWD)</label>
                        <span id="twdEstimate" class="text-[10px] font-bold text-blue-600 bg-blue-100 px-2 py-0.5 rounded-md hidden"></span>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-400 font-bold" id="currencySymbol">$</span>
                        </div>
                        <input type="number" id="consumeAmt" placeholder="輸入當地金額..." class="w-full pl-8 pr-4 py-3.5 rounded-xl border-none bg-white text-lg focus:ring-2 focus:ring-blue-500 text-gray-800 font-black shadow-sm" oninput="executeSearch()">
                    </div>
                </div>

                <div>
                    <label for="storeSearch" class="text-sm font-black text-gray-800 tracking-wide mb-2 block">消費通路</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="storeSearch" oninput="executeSearch()" placeholder="輸入店名、平台或飯店..." class="w-full pl-9 pr-4 py-3 border-none rounded-xl bg-white text-base focus:ring-2 focus:ring-blue-500 text-gray-800 font-bold shadow-sm">
                    </div>
                </div>
            </div>

            <button onclick="togglePaymentModal(true)" class="w-full mb-6 bg-white border border-gray-200 hover:border-blue-300 p-3.5 rounded-[16px] shadow-sm flex items-center justify-between transition-colors">
                <div class="flex items-center">
                    <div class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center mr-3">
                        <i class="fas fa-wallet text-sm"></i>
                    </div>
                    <div class="text-left">
                        <div class="text-xs text-gray-500 font-bold">我的支付組合</div>
                        <div class="text-sm font-black text-gray-800" id="activeToolsSummary">載入中...</div>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-300 text-sm"></i>
            </button>
            
            <!-- 結果顯示區 -->
            <div id="resultsArea" aria-live="polite" class="hidden opacity-0 transition-opacity duration-300">
                <div class="flex items-center mb-3">
                    <h3 class="text-sm font-black text-gray-800 flex-1">🏆 最佳推薦</h3>
                    <span class="text-[10px] text-gray-400 font-bold" id="matchCountBadge"></span>
                </div>
                
                <!-- 冠軍卡片 -->
                <div id="championCard" class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-[20px] p-5 shadow-md mb-4 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-10 transform translate-x-1/2 -translate-y-1/2"></div>
                </div>

                <!-- 其他適用備案 (無限制完整呈現所有勾選卡片) -->
                <div id="otherOptionsArea" class="hidden mb-6">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">其他適用方案與備案</h4>
                    <div id="otherOptionsList" class="space-y-2"></div>
                </div>
                
                <div class="text-center pt-4 border-t border-gray-100">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLScXQyG2T1K9AOhx_4oQ3NkVH8gB4s5cR_M2Dq6T0c_wG_x5Xw/viewform" target="_blank" class="inline-flex items-center justify-center text-gray-500 text-xs font-bold hover:text-blue-600 transition-colors">
                        <i class="fas fa-comment-dots mr-1.5"></i>資料有誤或找不到店名？點此回報
                    </a>
                </div>
            </div>

            <!-- 無結果提示 -->
            <div id="noResultPrompt" class="hidden text-center py-8">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-search-minus text-2xl text-gray-300"></i>
                </div>
                <p class="text-gray-500 font-bold text-sm mb-1">找不到符合的方案</p>
                <p class="text-xs text-gray-400 mb-6">請嘗試更改關鍵字，或檢查支付組合。</p>
                
                <a href="https://docs.google.com/forms/d/e/1FAIpQLScXQyG2T1K9AOhx_4oQ3NkVH8gB4s5cR_M2Dq6T0c_wG_x5Xw/viewform" target="_blank" class="inline-flex items-center justify-center bg-gray-800 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-md hover:bg-gray-700 transition-colors">
                    <i class="fas fa-comment-dots mr-2"></i>回報遺漏的店名給瘋哥
                </a>
            </div>

            <div id="idleState" class="text-center py-10 opacity-60">
                <i class="fas fa-credit-card text-4xl text-gray-200 mb-3"></i>
                <p class="text-sm text-gray-400 font-bold">輸入金額與店名，立即精算最佳回饋</p>
            </div>

        </div>
    </div>

    <div id="backdrop" class="backdrop fixed inset-0 bg-black/60 z-40" onclick="togglePaymentModal(false)"></div>

    <!-- Bottom Sheet -->
    <div id="paymentModal" class="bottom-sheet fixed inset-x-0 bottom-0 z-50 bg-gray-50 rounded-t-[28px] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] max-h-[85vh] flex flex-col max-w-md mx-auto">
        <div class="flex-shrink-0 flex justify-center pt-3 pb-2 w-full touch-none" onclick="togglePaymentModal(false)">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        <div class="flex justify-between items-center px-6 pb-4 border-b border-gray-200">
            <h3 class="text-lg font-black text-gray-800">設定支付組合</h3>
            <button onclick="togglePaymentModal(false)" class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-300">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 scrollbar-hide">
            <div id="garageContainer" class="space-y-4">
                <div class="text-center text-xs text-gray-400 py-10 animate-pulse">
                    <i class="fas fa-spinner fa-spin text-xl mb-2 text-blue-500"></i><br>正在載入支付工具...
                </div>
            </div>
        </div>
        <div class="p-5 bg-white border-t border-gray-100 pb-[calc(1.25rem+env(safe-area-inset-bottom))]">
            <button onclick="togglePaymentModal(false)" class="w-full bg-blue-600 text-white font-black py-3.5 rounded-xl shadow-lg hover:bg-blue-700 transition-colors">
                確認組合
            </button>
        </div>
    </div>

    <script>
        let globalDatabase = {}; 
        let currentCountryData = []; 
        let currentCountry = 'TW'; 
        
        const MILEAGE_VALUATION = 0.5; 
        let fxRates = { TWD: 1, JPY: 4.5, KRW: 42.0, THB: 1.05, USD: 0.03125 }; 
        const countryCurrencyMap = {
            'TW': { code: 'TWD', name: '台幣', sym: 'NT$' },
            'JP': { code: 'JPY', name: '日圓', sym: '¥' },
            'KR': { code: 'KRW', name: '韓元', sym: '₩' },
            'TH': { code: 'THB', name: '泰銖', sym: '฿' }
        };

        // 載入匯率
        fetch('https://api.exchangerate-api.com/v4/latest/TWD')
            .then(response => response.json())
            .then(data => { if (data && data.rates) fxRates = data.rates; })
            .catch(error => console.error("匯率載入失敗", error));
        
        const unicardConfig = {
            'simple': { name: '簡單選', base: 0.01, bonus: 0.02, capAmt: 50000, desc: "最高刷5萬拿滿加碼" },
            'any': { name: '任意選', base: 0.01, bonus: 0.025, capAmt: 40000, desc: "最高刷4萬拿滿加碼" },
            'up': { name: 'UP選', base: 0.01, bonus: 0.035, capAmt: 142857, desc: "最高刷14.2萬拿滿加碼" }
        };

        const hsbcConfig = {
            'infinite': { name: '旅人無限卡', tw: 18, overseas: 10 },
            'signature': { name: '旅人御璽卡', tw: 18, overseas: 15 },
            'light': { name: '旅人輕旅卡', tw: 20, overseas: 20 }
        };

        // 台新 Richart 權益智慧大腦
        function getRichartMatch(searchVal, currentCountry) {
            searchVal = searchVal.toLowerCase();
            let bestMatch = { plan: '一般保底', rate: 0.003 }; 
            
            if (currentCountry !== 'TW') {
                bestMatch = { plan: '玩旅刷', rate: 0.033 };
                if (['line pay', '全盈', '全盈pay', '台新pay'].some(kw => searchVal.includes(kw))) {
                    bestMatch = { plan: 'Pay著刷', rate: 0.023 };
                }
                return bestMatch;
            }

            const rules = [
                { plan: '天天刷', rate: 0.033, keywords: ['唐吉訶德', '大樹', '康是美', '寶雅', '家樂福', '大買家', '7-11', '7-eleven', '全家'] },
                { plan: '數趣刷', rate: 0.033, keywords: ['蝦皮', 'shopee', 'momo', '酷澎', 'coupang'] },
                { plan: '玩旅刷', rate: 0.033, keywords: ['高鐵', '長榮', '星宇', '華航', '虎航', '機票', '旅行社'] },
                { plan: 'Pay著刷', rate: 0.023, keywords: ['line pay', '全盈', '全盈pay'] },
                { plan: 'Pay著刷(台新Pay)', rate: 0.038, keywords: ['台新pay'] }
            ];

            for (let rule of rules) {
                if (rule.keywords.some(kw => searchVal.includes(kw))) {
                    if (rule.rate > bestMatch.rate) {
                        bestMatch = { plan: rule.plan, rate: rule.rate };
                    }
                }
            }
            return bestMatch;
        }

        fetch('cube_config.json')
            .then(response => response.json())
            .then(data => { 
                globalDatabase = data; 
                renderDynamicUI('TW'); 
                updateActiveCount();
            })
            .catch(error => console.error('無法載入資料庫:', error));

        const countryPlaceholders = {
            'TW': '輸入全聯、高鐵、星巴克...',
            'JP': '輸入唐吉訶德、大國藥妝...',
            'KR': '輸入 CU、Olive Young...',
            'TH': '輸入 7-11、Big C...'
        };

        function setCountry(code, btn) {
            currentCountry = code;
            document.querySelectorAll('.country-btn').forEach(b => {
                b.className = 'country-btn flex-1 bg-gray-100 text-gray-500 px-4 py-2.5 rounded-full text-sm font-bold transition-all hover:bg-gray-200';
            });
            btn.className = 'country-btn flex-1 bg-blue-600 text-white px-4 py-2.5 rounded-full text-sm font-bold shadow-md transition-all';
            
            document.getElementById('storeSearch').placeholder = countryPlaceholders[code];
            document.getElementById('storeSearch').value = '';
            document.getElementById('consumeAmt').value = '';
            
            let curr = countryCurrencyMap[code];
            document.getElementById('amtLabel').innerText = `消費金額 (${curr.code})`;
            document.getElementById('currencySymbol').innerText = curr.sym;
            document.getElementById('twdEstimate').classList.add('hidden');
            
            renderDynamicUI(code);
            executeSearch();
        }

        function togglePaymentModal(show) {
            const modal = document.getElementById('paymentModal');
            const backdrop = document.getElementById('backdrop');
            if(show) {
                modal.classList.add('show');
                backdrop.classList.add('show');
            } else {
                modal.classList.remove('show');
                backdrop.classList.remove('show');
                updateActiveCount();
                executeSearch(); 
            }
        }

        function formatPaymentNameWithImage(method) {
            let imgFileName = null;
            let cssFallback = '<i class="fas fa-credit-card text-gray-400 text-sm mr-2 mt-0.5 flex-shrink-0" id="fallback-'+method+'"></i>';

            if (method.includes('星宇')) imgFileName = 'starlux.png';
            else if (method.includes('飛行')) imgFileName = 'dbs.png';
            else if (method.includes('滙豐') || method.includes('旅人')) imgFileName = 'hsbc.png';
            else if (method.includes('CUBE')) imgFileName = 'cube.png';
            else if (method.includes('Unicard')) imgFileName = 'unicard.png';
            else if (method.includes('台新')) cssFallback = '<span class="bg-[#E4002B] text-white text-[10px] px-1 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">台新</span>';
            else if (method.includes('PayPay')) cssFallback = '<span class="bg-[#FF0032] text-white text-[12px] w-[20px] h-[20px] flex items-center justify-center rounded-[6px] font-black italic mr-2 shadow-sm flex-shrink-0">P</span>';
            else if (method.includes('全盈')) cssFallback = '<span class="bg-[#00B1EB] text-white text-[8px] px-1 py-0.5 rounded-[4px] font-black mr-2 mt-0.5 shadow-sm flex-shrink-0">全盈</span>';
            else if (method.includes('LINE Pay')) cssFallback = '<i class="fab fa-line text-[#06C755] text-lg mr-2 mt-0.5 flex-shrink-0"></i>';

            let mainName = method, subName = '';
            if (method.includes('(') && method.includes(')')) {
                let parts = method.split('(');
                mainName = parts[0].trim();
                subName = '(' + parts[1];
            }

            let imgTag = imgFileName 
                ? `<img src="images/${imgFileName}" class="fallback-icon" onload="this.className='loaded'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
                : '';

            return `
                <div class="flex items-start w-full">
                    ${imgTag}
                    <div style="${imgFileName ? 'display:none;' : 'display:flex;'}">${cssFallback}</div>
                    <div class="flex flex-col flex-1 overflow-hidden ml-1">
                        <span class="font-bold text-[13px] text-gray-800 truncate leading-tight">${mainName}</span>
                        ${subName ? `<span class="text-[9px] text-gray-400 font-normal leading-tight mt-0.5">${subName}</span>` : ''}
                    </div>
                </div>
            `;
        }

        window.toggleStarluxBirthday = function() {
            const level = document.getElementById('starluxLevel').value;
            const bdayDiv = document.getElementById('starluxBirthdayDiv');
            const bdayCheck = document.getElementById('starluxBirthdayCheck');
            if (level === 'titanium') {
                bdayDiv.classList.add('hidden');
                if (bdayCheck) bdayCheck.checked = false;
            } else {
                if (bdayDiv) bdayDiv.classList.remove('hidden');
            }
        };

        window.toggleCategoryCards = function(contentId, isChecked, event) {
            if(event) event.stopPropagation(); 
            const content = document.getElementById(contentId);
            if(content) {
                const checkboxes = content.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(cb => cb.checked = isChecked);
            }
        };

        function buildCheckboxBlock(method) {
            let extraDropdown = '';
            if (method.includes('Unicard')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="unicardLevel" class="w-full text-[11px] border-none rounded-md py-1.5 bg-emerald-50/50 text-emerald-700 font-bold focus:ring-0">
                            <option value="up" selected>🏆 UP選 (4.5%)</option>
                            <option value="any">🎯 任意選 (3.5%)</option>
                            <option value="simple">🔰 簡單選 (3%)</option>
                        </select>
                    </div>`;
            } else if (method.includes('全盈')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="pluspayLevel" class="w-full text-[11px] border-none rounded-md py-1.5 bg-blue-50/50 text-blue-700 font-bold focus:ring-0">
                            <option value="old" selected>👤 舊戶</option>
                            <option value="new">🌟 新戶</option>
                        </select>
                    </div>`;
            } else if (method.includes('滙豐') || method.includes('旅人')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="hsbcLevel" class="w-full text-[11px] border-none rounded-md py-1.5 bg-gray-50 text-gray-700 font-bold focus:ring-0">
                            <option value="infinite" selected>💳 旅人無限卡</option>
                            <option value="signature">💳 旅人御璽卡</option>
                            <option value="light">💳 旅人輕旅卡</option>
                        </select>
                    </div>`;
            } else if (method.includes('星宇')) {
                extraDropdown = `
                    <div class="mt-2.5 pt-2.5 border-t border-gray-100">
                        <select id="starluxLevel" class="w-full text-[11px] border-none rounded-md py-1.5 bg-yellow-50/50 text-yellow-700 font-bold focus:ring-0 mb-1.5" onchange="toggleStarluxBirthday()">
                            <option value="world" selected>✈️ 世界卡</option>
                            <option value="business">✈️ 商務鈦金卡</option>
                            <option value="titanium">✈️ 鈦金卡</option>
                        </select>
                        <div id="starluxBirthdayDiv" class="flex items-center ml-1 ${currentCountry === 'TW' ? 'hidden' : ''}">
                            <input type="checkbox" id="starluxBirthdayCheck" class="w-3 h-3 text-yellow-600 rounded border-gray-300 mr-1.5">
                            <label for="starluxBirthdayCheck" class="text-[10px] text-gray-500 font-bold cursor-pointer">🎂 剛好是生日月</label>
                        </div>
                    </div>`;
            }
            return `
                <div class="flex flex-col bg-white p-3 rounded-[14px] border border-gray-100 shadow-sm w-full">
                    <label class="flex items-center cursor-pointer w-full">
                        <input type="checkbox" value="${method}" checked class="tool-checkbox w-4 h-4 text-blue-600 rounded border-gray-300 mr-2.5 flex-shrink-0 focus:ring-blue-500">
                        ${formatPaymentNameWithImage(method)}
                    </label>
                    ${extraDropdown}
                </div>`;
        }

        function renderDynamicUI(countryCode) {
            const countryObj = globalDatabase[countryCode] || {};
            const paymentMethods = Object.keys(countryObj);
            
            const container = document.getElementById('garageContainer');
            
            if (paymentMethods.length === 0) {
                container.innerHTML = `<div class="text-xs text-rose-500 p-3 text-center font-bold">該區尚無資料</div>`;
                return;
            }

            let categories = {
                mobile: { title: '📱 支付工具', items: [] },
                mileage: { title: '✈️ 航空哩程卡', items: [] },
                cashback: { title: '💰 信用卡回饋', items: [] }
            };

            paymentMethods.forEach(method => {
                let htmlBlock = buildCheckboxBlock(method);
                let isMileage = false;
                if(countryObj[method]) {
                    for (const plan in countryObj[method]) {
                        if (countryObj[method][plan].some(store => store.type === 'mileage')) { isMileage = true; break; }
                    }
                }
                
                if (isMileage) categories.mileage.items.push(htmlBlock);
                else if (/Pay|支付|Wallet|iPass|街口|TrueMoney/i.test(method)) categories.mobile.items.push(htmlBlock);
                else categories.cashback.items.push(htmlBlock);
            });

            let finalHtml = '';
            for (let catKey in categories) {
                let cat = categories[catKey];
                if (cat.items.length > 0) {
                    let contentId = `cat-content-${catKey}`;
                    finalHtml += `
                        <div class="mb-4">
                            <div class="flex justify-between items-center mb-2 px-1">
                                <h3 class="text-[13px] font-black text-gray-700">${cat.title}</h3>
                                <div class="flex space-x-2">
                                    <button onclick="toggleCategoryCards('${contentId}', true, event)" class="text-[10px] text-blue-600 font-bold">全選</button>
                                    <button onclick="toggleCategoryCards('${contentId}', false, event)" class="text-[10px] text-gray-400 font-bold">清空</button>
                                </div>
                            </div>
                            <div id="${contentId}" class="grid grid-cols-2 gap-2">
                                ${cat.items.join('')}
                            </div>
                        </div>
                    `;
                }
            }
            container.innerHTML = finalHtml;

            const bdayDiv = document.getElementById('starluxBirthdayDiv');
            if (bdayDiv) {
                const sLevel = document.getElementById('starluxLevel').value;
                if (countryCode === 'TW' || sLevel === 'titanium') bdayDiv.classList.add('hidden');
                else bdayDiv.classList.remove('hidden');
            }

            currentCountryData = [];
            for (const method in countryObj) {
                for (const plan in countryObj[method]) {
                    countryObj[method][plan].forEach(store => {
                        let baseItem = { card: method, name: store.name, plan: plan };
                        if (store.type === 'mileage') {
                            baseItem.type = 'mileage';
                            baseItem.ratio = store.ratio;
                            baseItem.unit = store.unit;
                            baseItem.rate = MILEAGE_VALUATION / store.ratio; 
                        } else {
                            baseItem.type = 'cashback';
                            baseItem.rate = store.rate;
                        }
                        currentCountryData.push(baseItem);
                    });
                }
            }
        }

        function updateActiveCount() {
            const checkboxes = document.querySelectorAll('.tool-checkbox');
            let activeCards = 0, activeWallets = 0;
            checkboxes.forEach(cb => {
                if(cb.checked) {
                    if(/Pay|支付|Wallet|iPass|街口|TrueMoney/i.test(cb.value)) activeWallets++;
                    else activeCards++;
                }
            });
            let txt = [];
            if(activeCards > 0) txt.push(`${activeCards} 張卡片`);
            if(activeWallets > 0) txt.push(`${activeWallets} 款支付`);
            document.getElementById('activeToolsSummary').innerText = txt.length > 0 ? txt.join(' · ') : '未選取任何工具';
        }

        function getPromoRule(item) {
            if (!item) return null;
            if (item.name.includes('麥當勞APP點餐')) return { base: 0.03, bonus: 0.075, capAmt: 1066, desc: "最高刷 $1,066 拿滿加碼" };
            if (item.name.includes('星巴克儲值')) return { base: 0.03, bonus: 0.02, capAmt: 5000, desc: "最高刷 $5,000 拿滿加碼" };
            
            if (item.card.includes('Unicard')) {
                const uSel = document.getElementById('unicardLevel');
                const uLevel = uSel ? uSel.value : 'up';
                return unicardConfig[uLevel];
            }
            return null;
        }

        function searchMatch(val, name) {
            return val.trim().toLowerCase().split(/\s+/).every(kw => name.toLowerCase().includes(kw));
        }

        function executeSearch() {
            try {
                _executeSearch();
            } catch (e) {
                console.error('搜尋執行錯誤:', e);
                document.getElementById('resultsArea').classList.add('hidden');
                document.getElementById('idleState').classList.add('hidden');
                document.getElementById('noResultPrompt').classList.remove('hidden');
            }
        }

        function _executeSearch() {
            const val = document.getElementById('storeSearch').value.trim(); 
            const rawAmt = parseFloat(document.getElementById('consumeAmt').value) || 0;
            const resArea = document.getElementById('resultsArea');
            const idleState = document.getElementById('idleState');
            const noResult = document.getElementById('noResultPrompt');
            const estDiv = document.getElementById('twdEstimate');
            
            let twdAmt = rawAmt;
            const currCode = countryCurrencyMap[currentCountry].code;
            if (currentCountry !== 'TW' && fxRates[currCode] && rawAmt > 0) {
                twdAmt = rawAmt / fxRates[currCode];
                estDiv.innerText = `≈ NT$ ${Math.round(twdAmt).toLocaleString()}`;
                estDiv.classList.remove('hidden');
            } else {
                estDiv.classList.add('hidden');
            }

            const checkedMethods = Array.from(document.querySelectorAll('.tool-checkbox:checked')).map(cb => cb.value);

            if (!val || checkedMethods.length === 0) { 
                resArea.classList.add('hidden');
                noResult.classList.add('hidden');
                idleState.classList.remove('hidden');
                resArea.classList.remove('opacity-100');
                return; 
            }

            idleState.classList.add('hidden');

            // 1. 抓出所有符合關鍵字的項目 (進行淺拷貝避免汙染)
            let matchedList = currentCountryData
                .filter(item => searchMatch(val, item.name) && checkedMethods.includes(item.card))
                .map(m => ({ ...m }));

            // 2. 針對使用者勾選的每張卡片，如果沒有在資料庫被精準搜到，自動補上保底/通用規則
            checkedMethods.forEach(cardName => {
                // 檢查這張卡是不是已經在 matchedList 裡面了
                const alreadyHas = matchedList.some(m => m.card === cardName);
                if (!alreadyHas) {
                    // 如果使用者勾選了這張卡，但它沒有出現在該店的特定優惠中，就依照它的性質補上預設/保底方案
                    if (cardName.includes('CUBE')) {
                        matchedList.push({ card: cardName, name: `${val} (${currentCountry === 'TW' ? '國內通用' : '趣旅行'})`, plan: currentCountry === 'TW' ? '集精選' : '趣旅行', type: 'cashback', rate: currentCountry === 'TW' ? 0.02 : 0.03, isBaseline: true });
                    } else if (cardName.includes('Unicard')) {
                        const uSel = document.getElementById('unicardLevel');
                        const uConf = unicardConfig[uSel ? uSel.value : 'up'];
                        matchedList.push({ card: cardName, name: `${val} (${currentCountry === 'TW' ? '一般消費' : '海外實體'})`, plan: uConf.name, type: 'cashback', rate: uConf.base + uConf.bonus, isBaseline: true });
                    } else if (cardName.includes('滙豐') || cardName.includes('旅人')) {
                        const hSel = document.getElementById('hsbcLevel');
                        const hConf = hsbcConfig[hSel ? hSel.value : 'infinite'];
                        const ratio = currentCountry === 'TW' ? hConf.tw : hConf.overseas;
                        matchedList.push({ card: hConf.name, name: `${val} (${currentCountry === 'TW' ? '國內通用' : '海外消費'})`, plan: currentCountry === 'TW' ? '國內消費' : '海外消費', type: 'mileage', ratio: ratio, unit: '哩', rate: MILEAGE_VALUATION/ratio, isBaseline: true });
                    } else if (cardName.includes('台新') || cardName.includes('Richart')) {
                        const richartResult = getRichartMatch(val, currentCountry);
                        const matchNameSuffix = currentCountry !== 'TW' ? '(海外實體)' : '(國內實體)';
                        matchedList.push({ card: cardName, name: `${val} ${matchNameSuffix}`, plan: richartResult.plan, type: 'cashback', rate: richartResult.rate, isBaseline: true });
                    } else {
                        // 其他一般支付或錢包，若沒特定命中就給預設保底
                        matchedList.push({ card: cardName, name: `${val} (一般通路)`, plan: '一般消費', type: 'cashback', rate: 0.01, isBaseline: true });
                    }
                }
            });

            // 3. 統一動態參數計算 (Unicard 級距、滙豐哩程折算等)
            matchedList = matchedList.map(m => {
                if (m.card.includes('Unicard')) {
                    const uSel = document.getElementById('unicardLevel');
                    const uConf = unicardConfig[uSel ? uSel.value : 'up'];
                    m.rate = uConf.base + uConf.bonus; 
                    m.plan = uConf.name; 
                } 
                else if (m.card.includes('滙豐') || m.card.includes('旅人') || m.card.includes('旅人無限卡') || m.card.includes('旅人御璽卡') || m.card.includes('旅人輕旅卡')) {
                    const hSel = document.getElementById('hsbcLevel');
                    const hConf = hsbcConfig[hSel ? hSel.value : 'infinite'];
                    m.card = hConf.name;
                    m.ratio = currentCountry === 'TW' ? hConf.tw : hConf.overseas;
                    m.rate = MILEAGE_VALUATION / m.ratio;
                }
                return m;
            });

            // 4. 排序：回饋率由高到低
            matchedList.sort((a, b) => b.rate - a.rate);

            if (matchedList.length > 0) {
                noResult.classList.add('hidden');
                resArea.classList.remove('hidden');
                setTimeout(() => resArea.classList.add('opacity-100'), 50); 
                
                document.getElementById('matchCountBadge').innerText = `共 ${matchedList.length} 個方案`;
                
                // 第一名渲染為大張冠軍卡
                renderChampionCard(matchedList[0], twdAmt);

                // 第二名開始全部無限制完整呈現在備案清單
                const otherList = document.getElementById('otherOptionsList');
                if (matchedList.length > 1) {
                    document.getElementById('otherOptionsArea').classList.remove('hidden');
                    otherList.innerHTML = matchedList.slice(1).map(m => renderSmallCard(m, twdAmt)).join('');
                } else {
                    document.getElementById('otherOptionsArea').classList.add('hidden');
                }

            } else {
                resArea.classList.add('hidden');
                resArea.classList.remove('opacity-100');
                noResult.classList.remove('hidden');
            }
        }

        function renderChampionCard(m, twdAmt) {
            const card = document.getElementById('championCard');
            let rule = getPromoRule(m); 
            
            let badgeStyle = m.isBaseline ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-rose-100 text-rose-700 border-rose-200';
            let badgeText = m.isBaseline ? `通用保底` : `精準適用`;

            let mainRateHtml = '';
            let returnValHtml = '';
            let warningsHtml = '';

            if (m.type === 'mileage') {
                mainRateHtml = `${m.ratio}<span class="text-lg font-bold ml-1">元/${m.unit}</span>`;
                if(twdAmt > 0) returnValHtml = `約 ${Math.floor(twdAmt / m.ratio).toLocaleString()} ${m.unit}`;
                else returnValHtml = '輸入金額試算';
            } 
            else {
                let displayRate = rule ? (rule.base + rule.bonus)*100 : m.rate * 100;
                mainRateHtml = `${Number(displayRate.toFixed(2))}<span class="text-2xl font-bold ml-1">%</span>`;
                if(twdAmt > 0) {
                    let reward = rule ? (twdAmt * rule.base + Math.min(twdAmt, rule.capAmt) * rule.bonus) : twdAmt * m.rate;
                    returnValHtml = `NT$ ${Math.round(reward).toLocaleString()}`;
                    if(rule && twdAmt > rule.capAmt) warningsHtml += `<div class="mt-1.5 text-xs text-rose-500 font-bold"><i class="fas fa-exclamation-triangle mr-1"></i>已超過加碼上限</div>`;
                } else returnValHtml = '輸入金額試算';
            }

            if(rule) {
                warningsHtml += `<div class="mt-1 text-[11px] text-amber-600 font-bold bg-amber-50 px-2 py-1 rounded inline-block shadow-sm"><i class="fas fa-info-circle mr-1"></i>${rule.desc}</div>`;
            } else {
                warningsHtml += `<div class="mt-1 text-[11px] text-emerald-600 font-bold bg-emerald-50 px-2 py-1 rounded inline-block shadow-sm"><i class="fas fa-infinity mr-1"></i>回饋無上限</div>`;
            }

            card.innerHTML = `
                <div class="relative z-10 flex justify-between items-start mb-4">
                    <div>
                        <div class="text-[11px] font-bold ${badgeStyle} px-2 py-0.5 rounded border inline-block mb-1.5 shadow-sm">${badgeText} · ${m.name}</div>
                        <h2 class="text-xl font-black text-gray-800 tracking-tight leading-tight">${m.card.replace(/ \(.+\)/, '')}</h2>
                        <div class="text-sm font-bold text-blue-600 mt-0.5">切換至【${m.plan}】</div>
                    </div>
                </div>
                
                <div class="relative z-10 flex justify-between items-end border-t border-blue-100/50 pt-3">
                    <div>
                        <div class="text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">最高回饋率</div>
                        <div class="text-3xl font-black text-blue-700 leading-none">${mainRateHtml}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[11px] text-gray-500 font-bold uppercase tracking-wider mb-0.5">預估可得</div>
                        <div class="text-lg font-black text-rose-600">${returnValHtml}</div>
                    </div>
                </div>
                <div class="relative z-10">${warningsHtml}</div>
            `;
        }

        function renderSmallCard(m, twdAmt) {
            let rateText = '', valText = '';
            let rule = getPromoRule(m);
            let limitIcon = rule 
                ? `<span class="text-[9px] text-amber-600 font-bold ml-1 bg-amber-50 px-1.5 py-0.5 rounded" title="${rule.desc}">有上限</span>` 
                : `<span class="text-[9px] text-emerald-600 font-bold ml-1 bg-emerald-50 px-1.5 py-0.5 rounded"><i class="fas fa-infinity"></i> 無上限</span>`;

            if (m.type === 'mileage') {
                rateText = `${m.ratio}元/${m.unit}`;
                valText = twdAmt > 0 ? `${Math.floor(twdAmt / m.ratio).toLocaleString()} ${m.unit}` : '-';
            } else {
                rateText = rule ? `${Number(((rule.base + rule.bonus)*100).toFixed(2))}%` : `${Number((m.rate * 100).toFixed(2))}%`;
                if(twdAmt > 0) {
                    let reward = rule ? (twdAmt * rule.base + Math.min(twdAmt, rule.capAmt) * rule.bonus) : twdAmt * m.rate;
                    valText = `NT$ ${Math.round(reward).toLocaleString()}`;
                } else valText = '-';
            }

            return `
                <div class="bg-white p-3.5 rounded-xl border border-gray-200 flex justify-between items-center shadow-sm">
                    <div>
                        <div class="text-[14px] font-black text-gray-900 leading-tight">
                            ${m.card.replace(/ \(.+\)/, '')} 
                            <span class="text-blue-600 text-[12px] font-bold ml-1.5">${m.plan}</span>
                        </div>
                        <div class="text-[11px] font-bold text-gray-700 mt-1 flex items-center">
                            ${m.name} ${limitIcon}
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-base font-black text-blue-600">${rateText}</div>
                        <div class="text-xs font-bold text-rose-600">${valText}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
