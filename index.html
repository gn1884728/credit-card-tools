        body { padding-bottom: env(safe-area-inset-bottom); }

<body class="bg-gray-100 min-h-screen font-sans flex justify-center items-start pt-10 px-4">
    
    <div class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg border-t-4 border-blue-600 mb-8">
        <h2 class="text-2xl font-bold mb-2 text-center text-gray-800">
            <i class="fas fa-credit-card text-blue-600 mr-2"></i>信用卡權益速查
        </h2>
        <p class="text-center text-gray-500 text-xs mb-6 font-bold">目前支援：國泰世華 CUBE 卡</p>

        <div class="mb-5">
            <input type="text" id="storeSearch" oninput="searchStore()" placeholder="🔍 輸入店名速查 (例如：老井)..." class="w-full p-4 border border-gray-300 rounded-xl bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-bold text-gray-700">
        </div>
        
        <div id="storeResult" class="p-4 bg-blue-50 rounded-xl mb-6 text-sm font-bold text-blue-800 hidden border border-blue-100"></div>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-gray-500 text-xs mb-1.5 font-bold">消費金額 (NT$)</label>
                <input type="number" id="consumeAmt" placeholder="輸入金額" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-gray-700" oninput="calcPoints()">
            </div>
            <div>
                <label class="block text-gray-500 text-xs mb-1.5 font-bold">預估回饋率 (%)</label>
                <input type="number" id="consumeRate" placeholder="例如: 3" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-gray-700" oninput="calcPoints()">
            </div>
        </div>
        
        <div id="pointResult" class="text-center text-xl font-bold text-rose-600 py-4 bg-rose-50 rounded-xl border border-rose-100 mb-6">
            預估小樹點：0 點
        </div>

        <!-- 網報區塊 -->
        <div class="border-t border-gray-200 pt-5">
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                    <h4 class="text-sm font-bold text-blue-800 mb-1">查無特店？歡迎回報 🚀</h4>
                    <p class="text-xs text-gray-600">提供截圖，一起擴大最新資料庫！</p>
                </div>
                <a href="https://forms.gle/xLTZqzGPGXib2zYj6" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-4 rounded-lg shadow transition-colors whitespace-nowrap">
                    提供截圖
                </a>
            </div>
        </div>
    </div>

    <script>
        const customCubeData = [
            { name: "台中老井燒肉", plan: "趣旅行", rate: 0.03 }, 
            { name: "八方雲集", plan: "樂饗購", rate: 0.03 }, 
            { name: "支付寶", plan: "玩數位", rate: 0.03 }, 
            { name: "摩斯漢堡", plan: "樂饗購", rate: 0.03 }, 
            { name: "必勝客", plan: "樂饗購", rate: 0.03 }, 
            { name: "拿坡里", plan: "樂饗購", rate: 0.03 }, 
            { name: "品田牧場", plan: "樂饗購", rate: 0.03 }, 
            { name: "Mr.May義式百匯", plan: "樂饗購", rate: 0.03 }
        ];

        function fuzzyMatch(p, s) { 
            let pI = 0, sI = 0; 
            p = p.replace(/\s+/g, '').toLowerCase(); 
            s = s.replace(/\s+/g, '').toLowerCase(); 
            while (pI < p.length && sI < s.length) { 
                if (p[pI] === s[sI]) pI++; 
                sI++; 
            } 
            return pI === p.length; 
        }

        function searchStore() {
            const val = document.getElementById('storeSearch').value.trim(); 
            const resDiv = document.getElementById('storeResult');
            
            if (!val) { 
                resDiv.classList.add('hidden'); 
                return; 
            }
            let matchedList = customCubeData.filter(item => fuzzyMatch(val, item.name));
            if (matchedList.length > 0) {
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `✅ 找到 ${matchedList.length} 個適用方案：<br><br>` + 
                                   matchedList.map(m => `&bull; <b>${m.name}</b> ➔ 建議切換 <b>【${m.plan}】</b> (${m.rate*100}%)<br>`).join('');
                document.getElementById('consumeRate').value = matchedList[0].rate * 100; 
                calcPoints();
            } else { 
                resDiv.classList.remove('hidden'); 
                resDiv.innerHTML = `⚠️ 未找到符合通路，請手動輸入回饋率，或協助回報。`; 
            }
        }

        function calcPoints() {
            const amt = parseFloat(document.getElementById('consumeAmt').value) || 0; 
            const rate = (parseFloat(document.getElementById('consumeRate').value) || 0) / 100;
            document.getElementById('pointResult').innerText = `預估小樹點：${Math.round(amt * rate)} 點`;
        }
    </script>
</body>
